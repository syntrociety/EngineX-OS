name: Maestro DMX Studio
on:
  push:
    branches: [feat/maestro-dmx-studio]
    paths-ignore: ["docs/site/**", "docs/assets/screenshots/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mod:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test deck clock, OSC transport, MIDI and existing DMX
        run: go test -timeout 120s -race ./docs/mods/src/dmx-studio ./docs/mods/src/helper
      - name: Build the standalone mod for both deck architectures
        run: |
          python3 - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "tools/mods")
          import build_official_mods as b
          mod = next(m for m in b.MODS if m["id"] == "dmx-studio")
          with tempfile.TemporaryDirectory() as tmp:
              files = b.package_files(mod, b.build_helpers(Path(tmp)))
          manifest = __import__("json").loads(files["mod.json"])
          manifest.update(version="1.3.0-maestro.1", official=False, author="syntrociety / EngineX DMX Studio contributors", homepage="https://github.com/syntrociety/EngineX-OS", description="Automatic tag-based MaestroDMX OSC shows, deck clock and Xone MIDI faders.")
          files["mod.json"] = b.json_bytes(manifest)
          b.validate(files)
          Path("dmx-studio-maestro.tar.gz").write_bytes(b.archive(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dmx-studio-maestro
          path: dmx-studio-maestro.tar.gz
      - name: Verify native Qt Quick panel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-pyqt5.qtquick qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 qml-module-qtquick2
          QT_QUICK_BACKEND=software xvfb-run -a /usr/bin/python3 tools/mods/check_maestro_panel.py
      - uses: actions/upload-artifact@v4
        with:
          name: maestro-qml-preview
          path: maestro-*.png
  gateway:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify gateway ingestion and peer metadata
        run: go test ./pkg/webui -run 'Test(LightingTag|DeckClock|OwnForPeer)'
      - name: Verify lightweight clock producer
        working-directory: tools/az01-packer
        run: python3 -m unittest -k test_deck_clock_feed_for_dmx_without_panel test_ui_mod
      - name: Build the SC6000 clock gateway
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w -X github.com/Cd1s/EngineX-OS/pkg/webui.ReleaseBuild=1" -o enginex-suite ./cmd/enginex-suite
      - uses: actions/upload-artifact@v4
        with:
          name: maestro-clock-gateway-armv7
          path: enginex-suite
